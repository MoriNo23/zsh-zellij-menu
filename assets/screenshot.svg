<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'SF Mono','JetBrains Mono','Fira Code','Cascadia Code',monospace">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window -->
  <rect x="20" y="20" width="720" height="520" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <rect x="20" y="20" width="720" height="42" rx="14" fill="url(#header)"/>
  <rect x="20" y="42" width="720" height="20" fill="#1e293b"/>

  <!-- Window Buttons -->
  <circle cx="50" cy="41" r="6" fill="#ef4444"/>
  <circle cx="70" cy="41" r="6" fill="#eab308"/>
  <circle cx="90" cy="41" r="6" fill="#22c55e"/>

  <!-- Title -->
  <text x="380" y="47" text-anchor="middle" fill="#64748b" font-size="12">zsh-zellij-menu — Zellij Session Manager</text>

  <!-- ==================== LEVEL 1: MAIN MENU ==================== -->
  <rect x="70" y="80" width="620" height="195" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>

  <rect x="82" y="90" width="240" height="26" rx="4" fill="#1e293b"/>
  <text x="90" y="108" fill="#22c55e" font-size="14">zellij ❯</text>
  <rect x="175" y="97" width="8" height="14" fill="#22c55e" opacity="0.9"/>

  <text x="380" y="109" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="bold">Zellij - Menú Principal</text>

  <!-- Selected -->
  <rect x="90" y="130" width="580" height="34" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="108" y="152" fill="#22d3ee" font-size="14">📋 Explorar sesiones</text>
  <text x="650" y="152" text-anchor="end" fill="#475569" font-size="11">4/4</text>

  <!-- Unselected -->
  <rect x="92" y="172" width="576" height="30" rx="4" fill="transparent"/>
  <text x="108" y="192" fill="#cbd5e1" font-size="14">✨ Nueva sesión</text>

  <rect x="92" y="210" width="576" height="30" rx="4" fill="transparent"/>
  <text x="108" y="230" fill="#cbd5e1" font-size="14">🖥️  Shell sin Zellij</text>

  <!-- Bottom bar -->
  <rect x="90" y="252" width="580" height="1" fill="#1e293b"/>
  <text x="100" y="267" fill="#475569" font-size="10">⚡ 1/1  ●  0</text>
  <text x="655" y="267" text-anchor="end" fill="#475569" font-size="10">📂 4 sesiones activas</text>

  <!-- Arrow -->
  <text x="380" y="310" text-anchor="middle" fill="#334155" font-size="16">▼</text>

  <!-- ==================== LEVEL 2: SESSION EXPLORER ==================== -->
  <rect x="70" y="330" width="620" height="195" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>

  <rect x="82" y="340" width="240" height="26" rx="4" fill="#1e293b"/>
  <text x="90" y="358" fill="#22c55e" font-size="14">zellij ❯</text>

  <text x="380" y="359" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">Sesiones disponibles</text>

  <!-- Session 1: web-app (selected) -->
  <rect x="90" y="375" width="580" height="32" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="108" y="397" fill="#a78bfa" font-size="14">web-app</text>
  <text x="360" y="397" fill="#94a3b8" font-size="12">⏱ 6m 33s ago</text>
  <circle cx="570" cy="390" r="4" fill="#22c55e" opacity="0.6"/>
  <text x="580" y="397" fill="#22c55e" font-size="11">active</text>

  <!-- Session 2: api-service -->
  <rect x="90" y="415" width="580" height="30" rx="4" fill="transparent"/>
  <text x="108" y="436" fill="#cbd5e1" font-size="14">api-service</text>
  <text x="360" y="436" fill="#94a3b8" font-size="12">⏱ 6m 21s ago</text>
  <circle cx="570" cy="429" r="4" fill="#22c55e" opacity="0.6"/>
  <text x="580" y="436" fill="#22c55e" font-size="11">active</text>

  <!-- Session 3: devops -->
  <rect x="90" y="453" width="580" height="30" rx="4" fill="transparent"/>
  <text x="108" y="474" fill="#cbd5e1" font-size="14">devops</text>
  <text x="360" y="474" fill="#94a3b8" font-size="12">⏱ 3m 15s ago</text>
  <circle cx="570" cy="468" r="4" fill="#ef4444" opacity="0.6"/>
  <text x="580" y="474" fill="#ef4444" font-size="11">EXITED</text>

  <!-- Ctrl+D hint -->
  <rect x="90" y="486" width="580" height="28" rx="4" fill="#1e293b" opacity="0.3"/>
  <text x="108" y="505" fill="#64748b" font-size="12">← Volver al menú principal</text>
  <rect x="560" y="493" width="100" height="18" rx="4" fill="#334155"/>
  <text x="570" y="506" fill="#a78bfa" font-size="10">Ctrl+D remove</text>
</svg>
