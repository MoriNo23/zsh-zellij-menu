<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'JetBrains Mono','Fira Code','Cascadia Code',monospace">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window -->
  <rect x="20" y="20" width="680" height="480" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <rect x="20" y="20" width="680" height="40" rx="12" fill="url(#header)"/>
  <rect x="20" y="40" width="680" height="20" fill="#1e293b"/>

  <!-- Window Buttons -->
  <circle cx="50" cy="40" r="6" fill="#ef4444"/>
  <circle cx="70" cy="40" r="6" fill="#eab308"/>
  <circle cx="90" cy="40" r="6" fill="#22c55e"/>

  <!-- Title -->
  <text x="360" y="46" text-anchor="middle" fill="#94a3b8" font-size="12">zsh-zellij-menu — Zellij Session Manager</text>

  <!-- ==================== LEVEL 1: MAIN MENU ==================== -->

  <!-- fzf border -->
  <rect x="80" y="80" width="560" height="200" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>

  <!-- fzf prompt -->
  <rect x="90" y="90" width="200" height="24" rx="4" fill="#1e293b"/>
  <text x="96" y="107" fill="#22c55e" font-size="13">zellij ❯</text>
  <rect x="175" y="97" width="8" height="14" fill="#22c55e" opacity="0.8"/> <!-- cursor -->

  <!-- Header -->
  <text x="360" y="108" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="bold">Zellij - Menú Principal</text>

  <!-- Menu Items -->
  <!-- Selected item (highlighted) -->
  <rect x="100" y="130" width="520" height="32" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
  <text x="116" y="151" fill="#22d3ee" font-size="14">📋 Explorar sesiones</text>
  <text x="610" y="151" text-anchor="end" fill="#64748b" font-size="11">12/12</text>

  <!-- Other items -->
  <rect x="100" y="170" width="520" height="28" rx="4" fill="transparent"/>
  <text x="116" y="189" fill="#cbd5e1" font-size="14">✨ Nueva sesión</text>

  <rect x="100" y="206" width="520" height="28" rx="4" fill="transparent"/>
  <text x="116" y="225" fill="#cbd5e1" font-size="14">🖥️  Shell sin Zellij</text>

  <!-- Search bar at bottom -->
  <rect x="100" y="250" width="520" height="1" fill="#334155"/>
  <text x="116" y="268" fill="#475569" font-size="11">⚡ 1/1  ●  0</text>

  <!-- Arrow indicator -->
  <text x="100" y="225" fill="#475569" font-size="11">❯</text>

  <!-- ==================== ARROW DOWN ==================== -->
  <text x="360" y="308" text-anchor="middle" fill="#475569" font-size="14">▼</text>

  <!-- ==================== LEVEL 2: SESSION EXPLORER ==================== -->
  <rect x="80" y="325" width="560" height="155" rx="8" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>

  <!-- fzf prompt -->
  <rect x="90" y="335" width="200" height="24" rx="4" fill="#1e293b"/>
  <text x="96" y="352" fill="#22c55e" font-size="13">zellij ❯</text>

  <!-- Header -->
  <text x="360" y="352" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">Sesiones disponibles</text>

  <!-- Session 1: EXITED -->
  <rect x="100" y="370" width="520" height="32" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="116" y="391" fill="#a78bfa" font-size="14">ui2 waydroid</text>
  <text x="350" y="391" fill="#94a3b8" font-size="12">⏱ 2h 5m 52s ago</text>
  <text x="550" y="391" fill="#ef4444" font-size="12">📌 EXITED</text>

  <!-- Session 2: active -->
  <rect x="100" y="410" width="520" height="28" rx="4" fill="transparent"/>
  <text x="116" y="429" fill="#cbd5e1" font-size="14">xd</text>
  <text x="350" y="429" fill="#94a3b8" font-size="12">⏱ 9m 24s ago</text>

  <!-- Back option -->
  <rect x="100" y="446" width="520" height="28" rx="4" fill="transparent"/>
  <text x="116" y="465" fill="#94a3b8" font-size="14">← Volver al menú principal</text>

  <!-- Arrow indicator on back -->
  <text x="100" y="465" fill="#475569" font-size="11">❯</text>

</svg>
